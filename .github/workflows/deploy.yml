name: Deploy 7AI Preview Test

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > /tmp/vps_deploy_key
          chmod 600 /tmp/vps_deploy_key

      - name: Deploy to VPS
        run: |
          ssh \
            -i /tmp/vps_deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "/var/www/7AI/deploy.sh"
